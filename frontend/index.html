<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFINIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/afinit.css">
</head>
<body>
<div class="app">
  <main class="screen" style="padding: 56px 28px 40px; gap: 32px">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
        <line x1="9" y1="10" x2="25" y2="12" stroke="var(--primary)" stroke-width="2"></line>
        <line x1="9" y1="10" x2="16" y2="25" stroke="var(--primary)" stroke-width="2"></line>
        <line x1="25" y1="12" x2="16" y2="25" stroke="var(--primary)" stroke-width="2"></line>
        <circle cx="9" cy="10" r="5" fill="var(--primary)"></circle>
        <circle cx="25" cy="12" r="4" fill="var(--accent)"></circle>
        <circle cx="16" cy="25" r="5" fill="var(--ink)"></circle>
      </svg>
      <span class="brand-name">AFINIT</span>
    </div>

    <div style="height: 170px; border-radius: 24px; background: var(--surface); border: 1px solid var(--border); overflow: hidden">
      <svg width="100%" height="170" viewBox="0 0 334 170" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <g stroke="var(--border-input)" stroke-width="1.5">
          <line x1="60" y1="50" x2="150" y2="85"></line><line x1="150" y1="85" x2="250" y2="45"></line>
          <line x1="150" y1="85" x2="200" y2="135"></line><line x1="60" y1="50" x2="85" y2="130"></line>
          <line x1="250" y1="45" x2="290" y2="115"></line><line x1="200" y1="135" x2="290" y2="115"></line>
        </g>
        <circle cx="60" cy="50" r="18" fill="var(--primary-soft)"></circle>
        <text x="60" y="55" text-anchor="middle" font-family="Figtree, sans-serif" font-size="13" font-weight="600" fill="var(--primary)">PA</text>
        <circle cx="250" cy="45" r="18" fill="var(--accent-soft)"></circle>
        <text x="250" y="50" text-anchor="middle" font-family="Figtree, sans-serif" font-size="13" font-weight="600" fill="var(--accent-soft-text)">JO</text>
        <circle cx="150" cy="85" r="24" fill="var(--primary)"></circle>
        <text x="150" y="90" text-anchor="middle" font-family="Figtree, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Córrer</text>
        <circle cx="85" cy="130" r="14" fill="var(--other-soft)"></circle>
        <circle cx="200" cy="135" r="16" fill="var(--ink)"></circle>
        <text x="200" y="139" text-anchor="middle" font-family="Figtree, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">19h</text>
        <circle cx="290" cy="115" r="13" fill="var(--primary-soft)"></circle>
      </svg>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 class="title title-xl">Troba gent amb qui fer el que t’agrada.</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.45" class="muted">Persones, quedades i comunitats a prop teu, amb els mateixos gustos i horaris.</p>
    </div>

    <form id="login" style="display: flex; flex-direction: column; gap: 14px; margin-top: auto" novalidate>
      <div class="field">
        <label for="email" style="font-size: 14px">Correu electrònic</label>
        <input id="email" class="input" type="email" autocomplete="email" placeholder="paula@example.com" required style="height: 48px; font-size: 16px">
      </div>
      <div id="error" class="error hidden" role="alert"></div>
      <button class="btn btn-primary btn-block" type="submit">Entrar</button>
      <p style="margin: 0; text-align: center; font-size: 15px" class="muted">Encara no tens compte? <a href="proximament.html?s=Registre" style="font-weight: 600">Registra’t</a></p>
    </form>
  </main>
</div>

<script src="js/afinit.js"></script>
<script>
  if (getUser()) location.replace('quedades.html');

  const form = document.getElementById('login');
  const errorBox = document.getElementById('error');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const button = form.querySelector('button');
    errorBox.classList.add('hidden');
    if (!email) {
      errorBox.textContent = 'Escriu el teu correu electrònic.';
      errorBox.classList.remove('hidden');
      return;
    }
    button.disabled = true;
    try {
      const user = await api('/auth/login', { method: 'POST', body: { email } });
      setUser(user);
      location.href = 'quedades.html';
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.remove('hidden');
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
