<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editar perfil · AFINIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/afinit.css">
<script src="js/theme.js"></script>
<style>
  .chips-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chip-toggle {
    padding: 8px 13px;
    border-radius: 12px;
    border: 1px solid var(--border-input);
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  .chip-toggle[aria-pressed="true"] {
    background: var(--primary-soft);
    border-color: var(--primary);
    color: var(--primary);
    font-weight: 600;
  }
  .slot-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .slot-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 11px;
    border-radius: 10px;
    background: var(--primary-soft);
    color: var(--primary-soft-text);
    font-size: 13px;
    font-weight: 600;
  }
  .slot-pill button {
    border: none;
    background: transparent;
    color: inherit;
    font-size: 16px;
    line-height: 1;
    padding: 0 2px;
    cursor: pointer;
  }
  .slot-builder {
    display: grid;
    grid-template-columns: 1.1fr 1fr 1fr auto;
    gap: 8px;
    align-items: end;
  }
</style>
</head>
<body>
<div class="app">
  <form class="screen" id="form" style="padding: 20px 24px 32px; gap: 14px" novalidate>
    <div class="topbar-left">
      <a class="icon-btn" href="perfil.html" aria-label="Tornar al perfil" id="back"></a>
      <h1 class="title title-md">Editar perfil</h1>
    </div>

    <div id="error" class="error hidden" role="alert"></div>

    <div class="row-2">
      <div class="field">
        <label for="name">Nom</label>
        <input id="name" class="input" type="text" maxlength="50" required>
      </div>
      <div class="field">
        <label for="surname">Cognoms</label>
        <input id="surname" class="input" type="text" maxlength="80" required>
      </div>
    </div>

    <div class="row-2">
      <div class="field">
        <label for="username">Nom d’usuari</label>
        <input id="username" class="input" type="text" autocomplete="username" maxlength="30" required>
      </div>
      <div class="field">
        <label for="email">Correu electrònic</label>
        <input id="email" class="input" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Nova contrasenya</label>
        <input id="password" class="input" type="password" autocomplete="new-password" minlength="4" placeholder="Deixa-ho buit per mantenir">
      </div>
    </div>

    <div class="row-2-1">
      <div class="field">
        <label for="zone">Zona</label>
        <select id="zone" class="input" required></select>
      </div>
      <div class="field">
        <label for="age">Edat</label>
        <input id="age" class="input" type="number" min="16" max="99">
      </div>
    </div>

    <div class="field">
      <label>Activitats que t’agraden</label>
      <div class="chips-grid" id="activities"></div>
    </div>

    <div class="field">
      <label>Hores disponibles per quedar</label>
      <div class="slot-builder">
        <div class="field">
          <label for="slot-day" class="muted" style="font-size: 12px">Dia</label>
          <select id="slot-day" class="input">
            <option value="Dl">Dl · Dilluns</option>
            <option value="Dm">Dm · Dimarts</option>
            <option value="Dc">Dc · Dimecres</option>
            <option value="Dj">Dj · Dijous</option>
            <option value="Dv">Dv · Divendres</option>
            <option value="Ds">Ds · Dissabte</option>
            <option value="Dg">Dg · Diumenge</option>
          </select>
        </div>
        <div class="field">
          <label for="slot-from" class="muted" style="font-size: 12px">De</label>
          <select id="slot-from" class="input"></select>
        </div>
        <div class="field">
          <label for="slot-to" class="muted" style="font-size: 12px">A</label>
          <select id="slot-to" class="input"></select>
        </div>
        <button class="btn btn-secondary btn-small" type="button" id="add-slot" style="height: 44px">Afegir</button>
      </div>
      <div id="slot-list" class="slot-list" style="margin-top: 6px"></div>
    </div>

    <button class="btn btn-primary btn-block" type="submit" id="save-btn" style="margin-top: auto">Desar canvis</button>
  </form>
</div>

<script src="js/afinit.js"></script>
<script>
  const user = requireUser();
  const $ = (id) => document.getElementById(id);
  const DAYS_ORDER = ['Dl', 'Dm', 'Dc', 'Dj', 'Dv', 'Ds', 'Dg'];
  const selectedActivities = new Set();
  const availableHours = new Set();

  $('back').innerHTML = icon('back');

  function showError(msg) {
    $('error').textContent = msg;
    $('error').classList.remove('hidden');
  }

  function initHourSelects() {
    const fromOpts = [];
    for (let h = 8; h <= 21; h++) {
      fromOpts.push(`<option value="${h}"${h === 18 ? ' selected' : ''}>${String(h).padStart(2, '0')}:00</option>`);
    }
    $('slot-from').innerHTML = fromOpts.join('');
    syncToHours();
  }

  function syncToHours() {
    const from = parseInt($('slot-from').value, 10);
    const prevTo = parseInt($('slot-to').value, 10);
    const opts = [];
    for (let h = from + 1; h <= 22; h++) {
      opts.push(`<option value="${h}">${String(h).padStart(2, '0')}:00</option>`);
    }
    $('slot-to').innerHTML = opts.join('');
    $('slot-to').value = String(prevTo > from ? prevTo : Math.min(from + 2, 22));
  }
  $('slot-from').addEventListener('change', syncToHours);

  function getMergedRanges() {
    const ranges = [];
    for (const day of DAYS_ORDER) {
      const hours = [];
      for (let h = 8; h <= 21; h++) {
        if (availableHours.has(`${day}-${h}`)) hours.push(h);
      }
      for (let i = 0; i < hours.length; i++) {
        const start = hours[i];
        let end = start + 1;
        while (i + 1 < hours.length && hours[i + 1] === end) {
          end++;
          i++;
        }
        ranges.push({ day, from_hour: start, to_hour: end });
      }
    }
    return ranges;
  }

  function renderSlots() {
    const ranges = getMergedRanges();
    if (!ranges.length) {
      $('slot-list').innerHTML = '<div class="empty" style="width: 100%">Cap franja disponible seleccionada.</div>';
      return;
    }
    $('slot-list').innerHTML = ranges.map(r => `
      <span class="slot-pill">
        <span>${r.day} · ${String(r.from_hour).padStart(2, '0')}:00 – ${String(r.to_hour).padStart(2, '0')}:00h</span>
        <button type="button" data-day="${r.day}" data-from="${r.from_hour}" data-to="${r.to_hour}" aria-label="Eliminar franja">×</button>
      </span>
    `).join('');
  }

  $('add-slot').addEventListener('click', () => {
    $('error').classList.add('hidden');
    const day = $('slot-day').value;
    const from = parseInt($('slot-from').value, 10);
    const to = parseInt($('slot-to').value, 10);
    for (let h = from; h < to; h++) availableHours.add(`${day}-${h}`);
    renderSlots();
  });

  $('slot-list').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-day]');
    if (!btn) return;
    const day = btn.dataset.day;
    const from = parseInt(btn.dataset.from, 10);
    const to = parseInt(btn.dataset.to, 10);
    for (let h = from; h < to; h++) availableHours.delete(`${day}-${h}`);
    renderSlots();
  });

  $('activities').addEventListener('click', (e) => {
    const chip = e.target.closest('.chip-toggle');
    if (!chip) return;
    const name = chip.dataset.name;
    if (selectedActivities.has(name)) {
      selectedActivities.delete(name);
      chip.setAttribute('aria-pressed', 'false');
    } else {
      selectedActivities.add(name);
      chip.setAttribute('aria-pressed', 'true');
    }
  });

  async function loadProfile() {
    try {
      const [profile, zones, activities] = await Promise.all([
        api(`/persons/${encodeURIComponent(user.id)}`),
        api('/zones'),
        api('/activities'),
      ]);

      $('name').value = profile.name || '';
      $('surname').value = profile.surname || '';
      $('email').value = profile.email || '';
      $('username').value = profile.username || '';
      $('age').value = profile.age ?? '';
      $('zone').innerHTML = zones.map(z => `<option value="${esc(z.name)}">${esc(z.name)}</option>`).join('');
      if (profile.zone) $('zone').value = profile.zone;

      for (const a of (profile.activities || [])) selectedActivities.add(a);
      $('activities').innerHTML = activities.map(a => {
        const active = selectedActivities.has(a.name);
        return `<button type="button" class="chip-toggle" data-name="${esc(a.name)}" aria-pressed="${active}">${esc(a.name)}</button>`;
      }).join('');

      for (const s of (profile.available_slots || [])) {
        availableHours.add(`${s.day}-${s.hour}`);
      }
      renderSlots();
    } catch (err) {
      showError(err.message);
    }
  }

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('error').classList.add('hidden');
    const name = $('name').value.trim();
    const surname = $('surname').value.trim();
    const username = $('username').value.trim();
    const email = $('email').value.trim().toLowerCase();
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showError('Escriu un correu electrònic vàlid.');
        $('email').focus();
        return;
      }
    const password = $('password').value;
    const slots = getMergedRanges();

    if (!name) { showError('El nom no pot quedar buit.'); $('name').focus(); return; }
    if (!surname) { showError('Els cognoms no poden quedar buits.'); $('surname').focus(); return; }
    if (!username || /\s/.test(username)) { showError('El nom d’usuari no és vàlid (no pot tenir espais).'); $('username').focus(); return; }
    if (password && password.length < 4) { showError('La nova contrasenya ha de tenir almenys 4 caràcters.'); $('password').focus(); return; }
    if (!selectedActivities.size) { showError('Tria almenys una activitat.'); return; }
    if (!slots.length) { showError('Afegeix almenys una franja disponible.'); return; }

    const ageVal = $('age').value.trim();
    const btn = $('save-btn');
    btn.disabled = true;

    try {
      const updated = await api(`/persons/${encodeURIComponent(user.id)}`, {
        method: 'PUT',
        body: {
          name,
          surname,
          username: username.toLowerCase(),
          password: password || null,
          age: ageVal ? parseInt(ageVal, 10) : null,
          zone: $('zone').value,
          activities: Array.from(selectedActivities),
        },
      });
      await api(`/persons/${encodeURIComponent(user.id)}/availability`, {
        method: 'PUT',
        body: { slots, mode: 'available' },
      });
      setUser({
        ...user,
        name: updated.name,
        surname: updated.surname,
        username: updated.username,
      });
      location.href = 'perfil.html';
    } catch (err) {
      showError(err.message);
      btn.disabled = false;
    }
  });

  initHourSelects();
  loadProfile();
</script>
</body>
</html>
